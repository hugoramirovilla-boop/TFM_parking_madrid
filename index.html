<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mapa integrado SER + EMT — TFM</title>
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f8fa; color: #17344f; }
    main { width: min(560px, calc(100vw - 48px)); text-align: center; }
    h1 { margin: 0 0 12px; font-size: clamp(22px, 4vw, 34px); }
    p { margin: 0 0 20px; color: #526579; line-height: 1.45; }
    progress { width: 100%; height: 12px; accent-color: #278779; }
    #error { display: none; margin-top: 18px; padding: 14px; color: #8c2630; background: #fff1f2; border: 1px solid #fecdd3; }
  </style>
</head>
<body>
  <main>
    <h1>Mapa integrado SER + EMT</h1>
    <p>Cargando la demostración interactiva del TFM…</p>
    <progress id="progress" max="15" value="0"></progress>
    <div id="error"></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
  <script>
    (async () => {
      const names = Array.from({ length: 15 }, (_, i) => `chunks/part-${String(i).padStart(2, "0")}`);
      let loaded = 0;
      const buffers = await Promise.all(names.map(async (name) => {
        const response = await fetch(name, { cache: "force-cache" });
        if (!response.ok) throw new Error(`No se pudo cargar ${name} (${response.status}).`);
        const buffer = await response.arrayBuffer();
        document.getElementById("progress").value = ++loaded;
        return new Uint8Array(buffer);
      }));

      const total = buffers.reduce((sum, part) => sum + part.byteLength, 0);
      const gzip = new Uint8Array(total);
      let offset = 0;
      for (const part of buffers) {
        gzip.set(part, offset);
        offset += part.byteLength;
      }

      let html;
      if ("DecompressionStream" in window) {
        const stream = new Blob([gzip]).stream().pipeThrough(new DecompressionStream("gzip"));
        html = await new Response(stream).text();
      } else if (window.pako) {
        html = window.pako.ungzip(gzip, { to: "string" });
      } else {
        throw new Error("El navegador no permite descomprimir la demostración.");
      }

      const url = URL.createObjectURL(new Blob([html], { type: "text/html;charset=utf-8" }));
      location.replace(url);
    })().catch((error) => {
      const box = document.getElementById("error");
      box.style.display = "block";
      box.textContent = `No se ha podido abrir el mapa: ${error.message}`;
    });
  </script>
</body>
</html>
